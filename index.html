<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Setup Savings Tracker</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      padding: 20px;
      margin: 0;
    }
    .container {
      max-width: 420px;
      width: 100%;
    }
    h1 {
      text-align: center;
      font-size: 1.5rem;
      margin-bottom: 20px;
      color: #38bdf8;
    }
    .card {
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 16px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
      border: 1px solid #334155;
    }
    .card h2 {
      margin-top: 0;
      font-size: 1.25rem;
      color: #f1f5f9;
    }
    .progress-container {
      background: #334155;
      border-radius: 8px;
      height: 16px;
      overflow: hidden;
      margin: 12px 0;
    }
    .progress-bar {
      background: linear-gradient(90deg, #22c55e, #4ade80);
      height: 100%;
      width: 0%;
      transition: width 0.4s ease;
    }
    input {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #ffffff;
      font-size: 1rem;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      border-radius: 8px;
      border: none;
      background: #2563eb;
      color: #ffffff;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover {
      background: #1d4ed8;
    }
    .hidden { display: none; }
    .split-box {
      background: #0f172a;
      padding: 12px;
      border-radius: 8px;
      margin-top: 12px;
      border-left: 4px solid #3b82f6;
    }
    .accent { color: #22c55e; font-weight: bold; }
  </style>
</head>
<body>

  <div class="container">
    <h1>🚀 Setup Target Tracker</h1>

    <div class="card">
      <h2>Goal: Ksh <span id="target-amount">170,000</span></h2>
      <p>Loop Balance: <span class="accent">Ksh <span id="current-savings">0</span></span></p>
      <div class="progress-container">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      <p id="progress-percent" style="text-align: right; margin: 0; font-size: 0.875rem; color: #94a3b8;">0% Complete</p>
    </div>

    <div class="card">
      <h3 style="margin-top: 0;">📥 Log Gig Payout</h3>
      <label for="gig-amount" style="font-size: 0.875rem; color: #94a3b8;">Payout Amount (Ksh):</label>
      <input type="number" id="gig-amount" placeholder="e.g. 5000">
      <button onclick="calculateSplit()">Calculate Split</button>

      <div id="split-results" class="hidden">
        <div class="split-box">
          <p style="margin: 4px 0;">🔒 <strong>Loop Savings (20%):</strong> Ksh <span id="save-split">0</span></p>
          <p style="margin: 4px 0;">🛒 Essentials (70%): Ksh <span id="essentials-split">0</span></p>
          <p style="margin: 4px 0;">📈 Trading Buffer (10%): Ksh <span id="trading-split">0</span></p>
        </div>
        <button onclick="confirmDeposit()" style="background: #16a34a;">Confirm & Add to Loop Balance</button>
      </div>
    </div>
  </div>

  <script>
    const GOAL = 170000;
    let currentSavings = parseFloat(localStorage.getItem('loopSavings')) || 0;
    let pendingSavings = 0;

    function updateUI() {
      document.getElementById('current-savings').innerText = currentSavings.toLocaleString();
      const percentage = Math.min((currentSavings / GOAL) * 100, 100).toFixed(1);
      document.getElementById('progress-bar').style.width = percentage + '%';
      document.getElementById('progress-percent').innerText = percentage + '% Complete';
    }

    function calculateSplit() {
      const amount = parseFloat(document.getElementById('gig-amount').value);
      if (isNaN(amount) || amount <= 0) return;

      pendingSavings = amount * 0.20;
      document.getElementById('save-split').innerText = pendingSavings.toLocaleString();
      document.getElementById('essentials-split').innerText = (amount * 0.70).toLocaleString();
      document.getElementById('trading-split').innerText = (amount * 0.10).toLocaleString();

      document.getElementById('split-results').classList.remove('hidden');
    }

    function confirmDeposit() {
      currentSavings += pendingSavings;
      localStorage.setItem('loopSavings', currentSavings);
      document.getElementById('gig-amount').value = '';
      document.getElementById('split-results').classList.add('hidden');
      updateUI();
    }

    updateUI();
  </script>

</body>
</html>
