<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber-Gear RPG Engine</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@600;700&display=swap');

    :root {
      --bg-dark: #07080d;
      --card-bg: #0e1017;
      --cyan-neon: #00f3ff;
      --purple-neon: #bc13fe;
      --pink-neon: #ff007f;
      --gold-neon: #ffd700;
      --green-neon: #00ff66;
    }

    body {
      font-family: 'Rajdhani', -apple-system, sans-serif;
      background-color: var(--bg-dark);
      color: #f1f5f9;
      display: flex;
      justify-content: center;
      padding: 16px;
      margin: 0;
      min-height: 100vh;
    }

    .container {
      max-width: 440px;
      width: 100%;
    }

    h1 {
      font-family: 'Orbitron', sans-serif;
      text-align: center;
      font-size: 1.3rem;
      margin-bottom: 16px;
      color: var(--cyan-neon);
      text-shadow: 0 0 12px rgba(0, 243, 255, 0.6);
      letter-spacing: 2px;
    }

    /* Character Status HUD */
    .hud-card {
      background: linear-gradient(135deg, #0e1017 0%, #151824 100%);
      padding: 20px;
      border-radius: 14px;
      margin-bottom: 16px;
      border: 1px solid rgba(188, 19, 254, 0.4);
      box-shadow: 0 0 20px rgba(188, 19, 254, 0.15);
      position: relative;
      overflow: hidden;
    }

    .avatar-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 16px;
    }

    .avatar-frame {
      width: 64px;
      height: 64px;
      border-radius: 12px;
      border: 2px solid var(--cyan-neon);
      box-shadow: 0 0 15px var(--cyan-neon);
      background: #181b29;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
    }

    .char-info {
      flex: 1;
    }

    .rank-badge {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.65rem;
      color: var(--pink-neon);
      background: rgba(255, 0, 127, 0.15);
      border: 1px solid var(--pink-neon);
      padding: 2px 6px;
      border-radius: 4px;
      letter-spacing: 1px;
      display: inline-block;
      margin-bottom: 4px;
    }

    .char-level {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.2rem;
      color: #fff;
      font-weight: 900;
    }

    /* EXP & Stats Bars */
    .exp-container {
      background: #08090d;
      border-radius: 8px;
      height: 14px;
      overflow: hidden;
      border: 1px solid #282c44;
      margin-top: 6px;
      position: relative;
    }

    .exp-bar {
      background: linear-gradient(90deg, var(--purple-neon), var(--cyan-neon));
      height: 100%;
      width: 0%;
      transition: width 0.4s ease;
      box-shadow: 0 0 10px var(--cyan-neon);
    }

    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px dashed rgba(255, 255, 255, 0.1);
    }

    .stat-box {
      background: rgba(0, 0, 0, 0.3);
      padding: 8px 12px;
      border-radius: 6px;
      border-left: 3px solid var(--cyan-neon);
    }

    .stat-label {
      font-size: 0.7rem;
      color: #94a3b8;
      text-transform: uppercase;
    }

    .stat-val {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.9rem;
      color: #fff;
      font-weight: 700;
    }

    /* Target Milestones */
    .target-card {
      background: var(--card-bg);
      border-radius: 10px;
      padding: 14px;
      margin-top: 10px;
      border: 1px solid #1e2235;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .target-card.attained {
      border-color: var(--green-neon);
      background: rgba(0, 255, 102, 0.05);
      box-shadow: 0 0 18px rgba(0, 255, 102, 0.25);
      animation: auraPulse 2s infinite alternate;
    }

    @keyframes auraPulse {
      0% { box-shadow: 0 0 12px rgba(0, 255, 102, 0.2); }
      100% { box-shadow: 0 0 22px rgba(0, 255, 102, 0.4); }
    }

    .target-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.9rem;
    }

    /* UI Inputs & Buttons */
    .input-card {
      background: var(--card-bg);
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 16px;
      border: 1px solid #1a1d2e;
    }

    input, button {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      border-radius: 8px;
      border: 1px solid #282c44;
      background: #07080d;
      color: #ffffff;
      font-size: 1rem;
      font-family: 'Rajdhani', sans-serif;
      box-sizing: border-box;
    }

    input:focus {
      outline: none;
      border-color: var(--cyan-neon);
      box-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
    }

    button {
      font-family: 'Orbitron', sans-serif;
      background: linear-gradient(90deg, var(--purple-neon), #2563eb);
      color: #ffffff;
      font-weight: 700;
      cursor: pointer;
      border: none;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* History Log */
    .history-list {
      list-style: none;
      padding: 0;
      margin: 10px 0 0 0;
      max-height: 160px;
      overflow-y: auto;
    }

    .history-item {
      background: #08090d;
      padding: 8px 12px;
      border-radius: 6px;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      border-left: 3px solid var(--purple-neon);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>⚡ CYBER-GEAR RPG SYSTEM</h1>

    <!-- Character Status HUD -->
    <div class="hud-card">
      <div class="avatar-header">
        <div class="avatar-frame">⚡</div>
        <div class="char-info">
          <span class="rank-badge" id="rank-title">E-RANK NOVICE</span>
          <div class="char-level">LEVEL <span id="char-level">0</span></div>
          <div class="exp-container">
            <div class="exp-bar" id="exp-bar"></div>
          </div>
          <div style="font-size: 0.7rem; color: #94a3b8; text-align: right; margin-top: 2px;">
            EXP: <span id="exp-current">0</span> / 1,000
          </div>
        </div>
      </div>

      <!-- Live Vault & Interest Stats -->
      <div class="stat-grid">
        <div class="stat-box" style="border-left-color: var(--cyan-neon);">
          <div class="stat-label">Loop Vault</div>
          <div class="stat-val">Ksh <span id="vault-total">0</span></div>
        </div>
        <div class="stat-box" style="border-left-color: var(--gold-neon);">
          <div class="stat-label">Passive MP (7.3% p.a.)</div>
          <div class="stat-val" style="color: var(--gold-neon);">+Ksh <span id="monthly-interest">0</span>/mo</div>
        </div>
      </div>
    </div>

    <!-- Active Gear Targets -->
    <div class="input-card">
      <h2 style="font-family: 'Orbitron', sans-serif; font-size: 1rem; margin: 0 0 10px 0; color: #fff;">
        🎯 Gear Quests
      </h2>

      <!-- Target 1 -->
      <div class="target-card" id="quest-1">
        <div class="target-header">
          <span>1. Infinix GT 30 Pro</span>
          <span style="color: var(--cyan-neon);">Ksh 38,000</span>
        </div>
        <div style="font-size: 0.8rem; color: #94a3b8; margin-top: 4px;" id="rem-1">
          Remaining: Ksh 38,000
        </div>
      </div>

      <!-- Target 2 -->
      <div class="target-card" id="quest-2">
        <div class="target-header">
          <span>2. Canon EOS 2000D</span>
          <span style="color: var(--cyan-neon);">Ksh 51,000</span>
        </div>
        <div style="font-size: 0.8rem; color: #94a3b8; margin-top: 4px;" id="rem-2">
          Unlocks after Phone
        </div>
      </div>

      <!-- Target 3 -->
      <div class="target-card" id="quest-3">
        <div class="target-header">
          <span>3. PS5 Slim Setup</span>
          <span style="color: var(--cyan-neon);">Ksh 81,000</span>
        </div>
        <div style="font-size: 0.8rem; color: #94a3b8; margin-top: 4px;" id="rem-3">
          Unlocks after Camera
        </div>
      </div>
    </div>

    <!-- Deposit Power-Up Action -->
    <div class="input-card">
      <label style="font-size: 0.8rem; color: #94a3b8;">Log Gig / Loop Transfer (Ksh):</label>
      <input type="number" id="deposit-input" placeholder="e.g. 5000">
      <button onclick="logPowerUp()" style="margin-top: 10px;">⚡ Gain EXP / Power Up</button>
    </div>

    <!-- History Logs -->
    <div class="input-card">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h3 style="margin: 0; font-size: 0.9rem; font-family: 'Orbitron', sans-serif;">📜 Quest Logs</h3>
        <button onclick="resetVault()" style="width: auto; padding: 4px 8px; font-size: 0.7rem; background: #ef4444;">Reset</button>
      </div>
      <ul id="log-list" class="history-list"></ul>
    </div>
  </div>

  <script>
    const TARGET_PHONE = 38000;
    const TARGET_CAMERA = 51000;
    const TARGET_PS5 = 81000;

    let vaultBalance = parseFloat(localStorage.getItem('rpgVault')) || 0;
    let logs = JSON.parse(localStorage.getItem('rpgLogs')) || [];

    function updateRPGSystem() {
      // 1. Vault & Interest Calculations (7.3% p.a.)
      const annualRate = 0.073;
      const monthlyRate = annualRate / 12;
      const monthlyYield = vaultBalance * monthlyRate;

      document.getElementById('vault-total').innerText = vaultBalance.toLocaleString();
      document.getElementById('monthly-interest').innerText = Math.round(monthlyYield).toLocaleString();

      // 2. Character Level & EXP System (1 Level = Ksh 1,000)
      const level = Math.floor(vaultBalance / 1000);
      const currentEXP = vaultBalance % 1000;
      const expPercent = (currentEXP / 1000) * 100;

      document.getElementById('char-level').innerText = level;
      document.getElementById('exp-current').innerText = Math.round(currentEXP).toLocaleString();
      document.getElementById('exp-bar').style.width = expPercent + '%';

      // 3. Rank Assignment based on Level
      const rankTitle = document.getElementById('rank-title');
      if (level >= 170) {
        rankTitle.innerText = "S-RANK PHANTOM";
        rankTitle.style.color = "var(--gold-neon)";
      } else if (level >= 89) {
        rankTitle.innerText = "A-RANK OPERATIVE";
        rankTitle.style.color = "var(--green-neon)";
      } else if (level >= 38) {
        rankTitle.innerText = "B-RANK HUNTER";
        rankTitle.style.color = "var(--cyan-neon)";
      } else {
        rankTitle.innerText = "E-RANK NOVICE";
        rankTitle.style.color = "var(--pink-neon)";
      }

      // 4. Milestone Quests (Aura Glows)
      updateQuestCards();

      // 5. Render Logs
      renderLogs();
    }

    function updateQuestCards() {
      // Quest 1: Phone
      const q1 = document.getElementById('quest-1');
      const rem1 = document.getElementById('rem-1');
      if (vaultBalance >= TARGET_PHONE) {
        q1.classList.add('attained');
        rem1.innerText = "⚡ ATTAINED & FUNDED!";
        rem1.style.color = "var(--green-neon)";
      } else {
        q1.classList.remove('attained');
        rem1.innerText = "Remaining: Ksh " + (TARGET_PHONE - vaultBalance).toLocaleString();
        rem1.style.color = "#94a3b8";
      }

      // Quest 2: Camera (Threshold = 89,000)
      const q2 = document.getElementById('quest-2');
      const rem2 = document.getElementById('rem-2');
      const totalCamera = TARGET_PHONE + TARGET_CAMERA;
      if (vaultBalance >= totalCamera) {
        q2.classList.add('attained');
        rem2.innerText = "📸 ATTAINED & FUNDED!";
        rem2.style.color = "var(--green-neon)";
      } else if (vaultBalance >= TARGET_PHONE) {
        q2.classList.remove('attained');
        rem2.innerText = "Remaining: Ksh " + (totalCamera - vaultBalance).toLocaleString();
        rem2.style.color = "#94a3b8";
      } else {
        q2.classList.remove('attained');
        rem2.innerText = "Unlocks after Phone";
        rem2.style.color = "#64748b";
      }

      // Quest 3: PS5 Setup (Threshold = 170,000)
      const q3 = document.getElementById('quest-3');
      const rem3 = document.getElementById('rem-3');
      const totalPS5 = totalCamera + TARGET_PS5;
      if (vaultBalance >= totalPS5) {
        q3.classList.add('attained');
        rem3.innerText = "🎮 S-RANK GOAL ATTAINED!";
        rem3.style.color = "var(--gold-neon)";
      } else if (vaultBalance >= totalCamera) {
        q3.classList.remove('attained');
        rem3.innerText = "Remaining: Ksh " + (totalPS5 - vaultBalance).toLocaleString();
        rem3.style.color = "#94a3b8";
      } else {
        q3.classList.remove('attained');
        rem3.innerText = "Unlocks after Camera";
        rem3.style.color = "#64748b";
      }
    }

    function logPowerUp() {
      const val = parseFloat(document.getElementById('deposit-input').value);
      if (isNaN(val) || val <= 0) return;

      vaultBalance += val;
      logs.push({
        amount: val,
        date: new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })
      });

      localStorage.setItem('rpgVault', vaultBalance);
      localStorage.setItem('rpgLogs', JSON.stringify(logs));

      document.getElementById('deposit-input').value = '';
      updateRPGSystem();
    }

    function renderLogs() {
      const logList = document.getElementById('log-list');
      logList.innerHTML = '';

      if (logs.length === 0) {
        logList.innerHTML = '<li style="color:#64748b; font-size:0.8rem; padding:4px 0;">No power-ups logged yet.</li>';
        return;
      }

      logs.slice().reverse().forEach(item => {
        const li = document.createElement('li');
        li.className = 'history-item';
        li.innerHTML = `
          <span>+Ksh ${item.amount.toLocaleString()} EXP</span>
          <span style="color:#64748b; font-size:0.75rem;">${item.date}</span>
        `;
        logList.appendChild(li);
      });
    }

    function resetVault() {
      if (confirm("Reset character stats and vault balance?")) {
        vaultBalance = 0;
        logs = [];
        localStorage.removeItem('rpgVault');
        localStorage.removeItem('rpgLogs');
        updateRPGSystem();
      }
    }

    updateRPGSystem();
  </script>
</body>
  </html>
